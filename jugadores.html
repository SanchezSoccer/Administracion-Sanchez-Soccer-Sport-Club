<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Credenciales - Sánchez Soccer</title>
    <link rel="stylesheet" href="style.css">
    <style>
      
        .credencial-card {
            width: 350px;
            height: 220px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            overflow: hidden;
            border: 1px solid #ddd;
            position: relative;
            font-family: Arial, sans-serif;
        }

        .c-header {
            background: #121212;
            color: #FF6600;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            font-weight: 900;
        }

        .c-body {
            display: flex;
            padding: 15px;
            gap: 15px;
        }

        .c-foto {
            width: 90px;
            height: 110px;
            background: #f0f0f0;
            border: 1px dashed #ccc;
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .c-foto img { width: 100%; height: 100%; object-fit: cover; }

        .c-info h2 { font-size: 18px; margin: 0; text-transform: uppercase; color: #121212; }
        .c-info p { color: #FF6600; font-weight: bold; margin: 5px 0; }
        .c-badge {
            background: #121212;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            display: inline-block;
            margin-top: 10px;
        }

        .c-footer {
            position: absolute;
            bottom: 0;
            width: 100%;
            background: #FF6600;
            color: white;
            text-align: center;
            font-size: 9px;
            padding: 5px 0;
            font-weight: bold;
        }

        @media print {
            body * { visibility: hidden; }
            #printable, #printable * { visibility: visible; }
            #printable {
                position: absolute;
                left: 0;
                top: 0;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            .sidebar, .btn-primary, .card-form, .seccion-titulo { display: none !important; }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
<aside class="sidebar">
            <div class="logo-container"><img src="logo.png" class="main-logo"></div>
            <nav class="menu">
                <a href="index.html" >🏠 Inicio</a>
                <a href="equipos.html">⚽ Equipos</a>
                <a href="partidos.html">📅 Partidos</a>
                <a href="posiciones.html">🏆 Posiciones</a>
                <a href="goleo.html">👟 Goleo</a>
                <a href="jugadores.html" class="active">👥 Jugadores</a>
            </nav>
        </aside>

        <main class="main-content">
            <div class="seccion-titulo">
                <h1>Generador de Credenciales</h1>
            </div>

            <div style="display:flex; gap:40px;">
                <div class="card-form" style="background:white; padding:20px; border-radius:12px; width:300px;">
                    <label>Nombre</label><br>
                    <input type="text" id="in-n" style="width:100%; padding:8px; margin-bottom:10px;">
                    <label>Equipo</label><br>
                    <input type="text" id="in-e" style="width:100%; padding:8px; margin-bottom:10px;">
                    <label>Foto</label><br>
                    <input type="file" id="in-f" style="margin-bottom:20px;">
                    <button class="btn-primary" onclick="actualizar()">Actualizar</button>
                    <button class="btn-primary" style="background:#333; margin-top:10px;" onclick="window.print()">🖨️ IMPRIMIR</button>
                </div>

                <div id="printable">
                    <div class="credencial-card">
                        <div class="c-header">
                            <span>SÁNCHEZ SOCCER</span>
                            <span>2026</span>
                        </div>
                        <div class="c-body">
                            <div class="c-foto">
                                <img id="p-f" src="" style="display:none;">
                                <span id="txt-f">FOTO</span>
                            </div>
                            <div class="c-info">
                                <h2 id="p-n">NOMBRE JUGADOR</h2>
                                <p id="p-e">EQUIPO</p>
                                <div class="c-badge">JUGADOR ACTIVO</div>
                            </div>
                        </div>
                        <div class="c-footer">LIGA REGIONAL DE COATZACOALCOS, VER.</div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        document.getElementById('in-f').onchange = function(e) {
            const [file] = e.target.files;
            if (file) {
                document.getElementById('p-f').src = URL.createObjectURL(file);
                document.getElementById('p-f').style.display = 'block';
                document.getElementById('txt-f').style.display = 'none';
            }
        };
        function actualizar() {
            document.getElementById('p-n').innerText = document.getElementById('in-n').value.toUpperCase();
            document.getElementById('p-e').innerText = document.getElementById('in-e').value;
        }
    </script>
</body>
</html>
