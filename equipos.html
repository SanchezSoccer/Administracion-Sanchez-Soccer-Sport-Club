<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Equipos - Sánchez Soccer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="logo-container"><img src="img/Logo.png" class="main-logo"></div>
            <nav class="menu">
                <a href="index.html">🏠 Inicio</a>
                <a href="equipos.html" class="active">⚽ Equipos</a>
                <a href="partidos.html">📅 Partidos</a>
                <a href="posiciones.html">🏆 Posiciones</a>
                <a href="goleo.html">👟 Goleo</a>
                <a href="jugadores.html">👥 Jugadores</a>
            </nav>
        </aside>

        <main class="main-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
                <div class="seccion-titulo" style="margin-bottom: 0;">
                    <h1>Gestión de Equipos</h1>
                </div>
                
                <div style="display: flex; gap: 15px; align-items: center;">
                    <label style="font-weight: bold; color: var(--texto);">Ver Categoría:</label>
                    <select id="filtro-categoria" onchange="filtrarTabla()" style="padding: 10px 15px; border-radius: 8px; border: 1px solid #ddd; font-weight: bold;">
                        <option value="libre">⚽ Libre</option>
                        <option value="juvenil">👦 Juvenil</option>
                        <option value="femenil">🙋‍♀️ Femenil</option>
                        <option value="veteranos">👴 Veteranos</option>
                    </select>
                    <button class="btn-primary" onclick="abrirM()">+ Nuevo Equipo</button>
                </div>
            </div>

            <table class="tabla-admin">
                <thead>
                    <tr>
                        <th>Escudo</th>
                        <th>Nombre del Club</th>
                        <th>Delegado</th>
                        <th>Categoría</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="lista-e">
                    </tbody>
            </table>
        </main>
    </div>

    <div id="modal-e" class="modal-overlay">
        <div class="modal-box">
            <h3>Registrar Club</h3><br>
            
            <div style="text-align: center; margin-bottom: 15px;">
                <label for="e-logo" style="cursor: pointer;">
                    <div id="escudo-preview" style="width: 70px; height: 70px; background: #eee; border-radius: 50%; margin: 0 auto; display: flex; align-items: center; justify-content: center; border: 2px dashed #ccc; overflow: hidden;">
                        <span id="txt-e" style="font-size: 0.8rem; color: #999;">Logo</span>
                        <img id="img-e" src="" style="width: 100%; height: 100%; object-fit: cover; display: none;">
                    </div>
                </label>
                <input type="file" id="e-logo" accept="image/*" style="display: none;">
                <p style="font-size: 0.7rem; color: #666; margin-top: 5px;">Haz clic para subir escudo</p>
            </div>

            <label style="font-size: 0.85rem; font-weight: bold;">Nombre del Equipo</label>
            <input type="text" id="n-eq" placeholder="Ej. Real Coatzacoalcos" style="width:100%; padding:10px; margin: 5px 0 15px 0; border-radius:8px; border:1px solid #ddd;">
            
            <label style="font-size: 0.85rem; font-weight: bold;">Nombre del Delegado</label>
            <input type="text" id="d-eq" placeholder="Ej. Luis Chávez" style="width:100%; padding:10px; margin: 5px 0 15px 0; border-radius:8px; border:1px solid #ddd;">
            
            <label style="font-size: 0.85rem; font-weight: bold;">Asignar Categoría</label>
            <select id="reg-cat" style="width:100%; padding:10px; margin: 5px 0 20px 0; border-radius:8px; border:1px solid #ddd; font-weight: bold;">
                <option value="libre">Libre</option>
                <option value="juvenil">Juvenil</option>
                <option value="femenil">Femenil</option>
                <option value="veteranos">Veteranos</option>
            </select>

            <button class="btn-primary" style="width:100%" onclick="guardarE()">Guardar Equipo</button>
            <button onclick="cerrarM()" style="width:100%; background:none; border:none; color:red; margin-top:10px; cursor:pointer;">Cancelar</button>
        </div>
    </div>

    <script>
        // Array global en memoria para guardar los equipos ingresados
        let databaseEquipos = [
            { n: "Real Coatzacoalcos", d: "Luis Chávez", cat: "libre", logo: "https://ui-avatars.com/api/?name=RC&background=FF6600&color=fff" },
            { n: "Deportivo Chávez", d: "Chávez Sr.", cat: "libre", logo: "https://ui-avatars.com/api/?name=DC&background=121212&color=fff" },
            { n: "Pumas Coatza (Juv)", d: "Prof. Ale", cat: "juvenil", logo: "https://ui-avatars.com/api/?name=PC&background=002244&color=fff" }
        ];

        let logoTemp = "";

        // Capturar y previsualizar la imagen del escudo subido
        document.getElementById('e-logo').onchange = function(e) {
            const [file] = e.target.files;
            if (file) {
                logoTemp = URL.createObjectURL(file);
                document.getElementById('img-e').src = logoTemp;
                document.getElementById('img-e').style.display = 'block';
                document.getElementById('txt-e').style.display = 'none';
            }
        };

        function abrirM() { 
            document.getElementById('modal-e').style.display = 'flex'; 
        }

        function cerrarM() { 
            document.getElementById('modal-e').style.display = 'none';
            // Limpiar formulario al cerrar
            document.getElementById('n-eq').value = "";
            document.getElementById('d-eq').value = "";
            document.getElementById('img-e').style.display = 'none';
            document.getElementById('txt-e').style.display = 'block';
            logoTemp = "";
        }

        // Renderizar la tabla usando únicamente la categoría seleccionada en el filtro principal
        function filtrarTabla() {
            const categoriaFiltro = document.getElementById('filtro-categoria').value;
            const tbody = document.getElementById('lista-e');
            
            const filtrados = databaseEquipos.filter(eq => eq.cat === categoriaFiltro);

            if (filtrados.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#999;">No hay equipos registrados en esta categoría</td></tr>`;
                return;
            }

            tbody.innerHTML = filtrados.map((eq, index) => `
                <tr>
                    <td><img src="${eq.logo}" style="width:40px; height:40px; border-radius:50%; object-fit:cover; border: 1px solid #eee;"></td>
                    <td><strong>${eq.n}</strong></td>
                    <td>${eq.d}</td>
                    <td style="text-transform: uppercase; font-size: 0.8rem; font-weight: bold; color: #666;">${eq.cat}</td>
                    <td><button onclick="eliminarEquipo('${eq.n}')" style="border:none; color:red; background:none; cursor:pointer; font-weight:bold;">Eliminar</button></td>
                </tr>
            `).join('');
        }

        // Registrar el nuevo equipo en la base de datos temporal
        function guardarE() {
            const nombre = document.getElementById('n-eq').value;
            const delegado = document.getElementById('d-eq').value;
            const categoria = document.getElementById('reg-cat').value;
            
            // Si no suben logo, asigna uno automático usando sus iniciales
            const escudoFinal = logoTemp || `https://ui-avatars.com/api/?name=${encodeURIComponent(nombre)}&background=ddd&color=333`;

            if (nombre && delegado) {
                databaseEquipos.push({
                    n: nombre,
                    d: delegado,
                    cat: categoria,
                    logo: escudoFinal
                });

                // Sincronizar el filtro de vista con la categoría del equipo recién guardado
                document.getElementById('filtro-categoria').value = categoria;
                
                filtrados = [];
                filtrarTabla();
                cerrarM();
            } else {
                alert("Por favor rellena el nombre y el delegado.");
            }
        }

        // Eliminar equipo del array
        function eliminarEquipo(nombreEquipo) {
            if(confirm(`¿Seguro que deseas eliminar a ${nombreEquipo}?`)) {
                databaseEquipos = databaseEquipos.filter(eq => eq.n !== nombreEquipo);
                filtrarTabla();
            }
        }

        // Cargar la lista inicial de categoría Libre al cargar el archivo
        filtrarTabla();
    </script>
</body>
</html>
