<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Goleo - Sánchez Soccer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="logo-container"><img src="Logo.png" class="main-logo"></div>
            <nav class="menu">
                <a href="index.html">🏠 Inicio</a>
                <a href="equipos.html">⚽ Equipos</a>
                <a href="partidos.html">📅 Partidos</a>
                <a href="posiciones.html">🏆 Posiciones</a>
                <a href="goleo.html" class="active">👟 Goleo</a>
                <a href="jugadores.html">👥 Jugadores</a>
            </nav>
        </aside>

        <main class="main-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
                <div class="seccion-titulo" style="margin-bottom: 0;">
                    <h1>Líderes de Goleo</h1>
                </div>
                <div>
                    <label style="font-weight: bold; margin-right: 10px;">Categoría:</label>
                    <select id="select-categoria" onchange="cambiarGoleo()" style="padding: 10px 15px; border-radius: 8px; border: 1px solid #ddd; font-weight: bold;">
                        <option value="libre">⚽ Libre</option>
                        <option value="juvenil">👦 Juvenil</option>
                        <option value="femenil">🙋‍♀️ Femenil</option>
                        <option value="veteranos">👴 Veteranos</option>
                    </select>
                </div>
            </div>

            <table class="tabla-admin">
                <thead>
                    <tr>
                        <th>Pos</th>
                        <th>Jugador</th>
                        <th>Equipo</th>
                        <th>Goles</th>
                    </tr>
                </thead>
                <tbody id="goleo-body">
                    </tbody>
            </table>
        </main>
    </div>

    <script>
        const goleadores = [
            { nombre: "Rabelo Jr.", equipo: "Real Coatzacoalcos", goles: 14, cat: "libre" },
            { nombre: "Luis Chávez", equipo: "Deportivo Chávez", goles: 11, cat: "libre" },
            { nombre: "Checo Pérez", equipo: "Pumas Coatza", goles: 9, cat: "juvenil" },
            { nombre: "Alejandra S.", equipo: "Sirenas FC", goles: 15, cat: "femenil" }
        ];

        function cargarGoleo(cat) {
            const tbody = document.getElementById('goleo-body');
            const filtrados = goleadores.filter(g => g.cat === cat).sort((a,b) => b.goles - a.goles);

            if(filtrados.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#999;">No hay goles registrados aquí</td></tr>`;
                return;
            }

            tbody.innerHTML = filtrados.map((g, i) => `
                <tr>
                    <td>${i + 1}</td>
                    <td><strong>${g.nombre}</strong></td>
                    <td>${g.equipo}</td>
                    <td style="color:var(--naranja); font-weight:bold; font-size:1.1rem;">${g.goles}</td>
                </tr>
            `).join('');
        }

        function cambiarGoleo() {
            cargarGoleo(document.getElementById('select-categoria').value);
        }

        cargarGoleo('libre');
    </script>
</body>
</html>
