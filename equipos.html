<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Equipos - Sánchez Soccer</title>
    <link rel="stylesheet" href="style.css">


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>

        const url = 'https://akodlefkapiskfnkaujg.supabase.co';
        const key = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFrb2RsZWZrYXBpc2tmbmthdWpnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQxMjU2ODYsImV4cCI6MjA4OTcwMTY4Nn0.pMoPvhtUSor6zOUF5Py6I1eJuhN1ZIU8Tt0AEZiqfsk';

        window.supabase = supabase.createClient(url, key);
        async function probarConexion() {
            try {
                const { data, error } = await window.supabase.from('categorias').select('*');

                if (error) {
                    console.error('Error de respuesta de Supabase:', error.message);
                } else {
                    console.log('Conexión exitosa, Datos recibidos:', data);
                }
            } catch (err) {
                console.error('Error: Base no recibe datos', err);
            }
        }
        probarConexion();
    </script>

</head>

<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="logo-container"><img src="Logo.png" class="main-logo"></div>
            <nav class="menu">
                <a href="index.html">🏠 Inicio</a>
                <a href="equipos.html" class="active">⚽ Equipos</a>
                <a href="partidos.html">📅 Partidos</a>
                <a href="posiciones.html">🏆 Posiciones</a>
                <a href="goleo.html">👟 Goleo</a>
                <a href="jugadores.html">👥 Jugadores</a>
            </nav>
        </aside>

        <main class="main-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
                <div class="seccion-titulo" style="margin-bottom: 0;">
                    <h1>Gestión de Equipos</h1>
                </div>

                <div style="display: flex; gap: 15px; align-items: center;">
                    <label style="font-weight: bold; color: var(--texto);">Ver Categoría:</label>
                    <select id="filtro-categoria" onchange="filtrarTabla()"
                        style="padding: 10px 15px; border-radius: 8px; border: 1px solid #ddd; font-weight: bold;">
                        <option value="libre">⚽ Libre</option>
                        <option value="juvenil">👦 Juvenil</option>
                        <option value="femenil">🙋‍♀️ Femenil</option>
                        <option value="veteranos">👴 Veteranos</option>
                    </select>
                    <button class="btn-primary" onclick="abrirM()">+ Nuevo Equipo</button>
                </div>
            </div>

            <table class="tabla-admin">
                <thead>
                    <tr>
                        <th>Escudo</th>
                        <th>Nombre del Club</th>
                        <th>Delegado</th>
                        <th>Categoría</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="lista-e">
                </tbody>
            </table>
        </main>
    </div>

    <div id="modal-e" class="modal-overlay">
        <div class="modal-box">
            <h3>Registrar Club</h3><br>

            <div style="text-align: center; margin-bottom: 15px;">
                <label for="e-logo" style="cursor: pointer;">
                    <div id="escudo-preview"
                        style="width: 70px; height: 70px; background: #eee; border-radius: 50%; margin: 0 auto; display: flex; align-items: center; justify-content: center; border: 2px dashed #ccc; overflow: hidden;">
                        <span id="txt-e" style="font-size: 0.8rem; color: #999;">Logo</span>
                        <img id="img-e" src="" style="width: 100%; height: 100%; object-fit: cover; display: none;">
                    </div>
                </label>
                <input type="file" id="e-logo" accept="image/*" style="display: none;">
                <p style="font-size: 0.7rem; color: #666; margin-top: 5px;">Haz clic para subir escudo</p>
            </div>

            <label style="font-size: 0.85rem; font-weight: bold;">Nombre del Equipo</label>
            <input type="text" id="n-eq" placeholder="Ej. Real Coatzacoalcos"
                style="width:100%; padding:10px; margin: 5px 0 15px 0; border-radius:8px; border:1px solid #ddd;">

            <label style="font-size: 0.85rem; font-weight: bold;">Nombre del Delegado</label>
            <input type="text" id="d-eq" placeholder="Ej. Luis Chávez"
                style="width:100%; padding:10px; margin: 5px 0 15px 0; border-radius:8px; border:1px solid #ddd;">

            <label style="font-size: 0.85rem; font-weight: bold;">Asignar Categoría</label>
            <select id="reg-cat"
                style="width:100%; padding:10px; margin: 5px 0 20px 0; border-radius:8px; border:1px solid #ddd; font-weight: bold;">
                <option value="libre">Libre</option>
                <option value="juvenil">Juvenil</option>
                <option value="femenil">Femenil</option>
                <option value="veteranos">Veteranos</option>
            </select>

            <button class="btn-primary" style="width:100%" onclick="guardarE()">Guardar Equipo</button>
            <button onclick="cerrarM()"
                style="width:100%; background:none; border:none; color:red; margin-top:10px; cursor:pointer;">Cancelar</button>
        </div>
    </div>





    <script>
        let listaCategoriasBD = [];
        let archivoImagenReal = null;

        document.getElementById('e-logo').onchange = function (e) {
            const file = e.target.files[0];
            if (file) {
                archivoImagenReal = file; 
                document.getElementById('img-e').src = URL.createObjectURL(file);
                document.getElementById('img-e').style.display = 'block';
                document.getElementById('txt-e').style.display = 'none';
            }
        };

        function abrirM() {
            document.getElementById('modal-e').style.display = 'flex';
        }

        function cerrarM() {
            document.getElementById('modal-e').style.display = 'none';
            document.getElementById('n-eq').value = "";
            document.getElementById('d-eq').value = "";
            document.getElementById('img-e').style.display = 'none';
            document.getElementById('txt-e').style.display = 'block';
            archivoImagenReal = null; // Limpiamos el archivo
        }

        async function inicializarPantalla() {
            try {
                const { data, error } = await window.supabase.from('categorias').select('*');
                if (error) throw error;
                listaCategoriasBD = data;
                filtrarTabla();
            } catch (err) {
                console.error('❌ Error al precargar categorías:', err.message);
            }
        }

        async function filtrarTabla() {
            const categoriaFiltroSelect = document.getElementById('filtro-categoria').value;
            const tbody = document.getElementById('lista-e');

            const catEncontrada = listaCategoriasBD.find(c =>
                c.nombre.toLowerCase().includes(categoriaFiltroSelect.toLowerCase())
            );

            if (!catEncontrada) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#999;">Cargando datos...</td></tr>`;
                return;
            }

            try {
                const { data: equipos, error } = await window.supabase
                    .from('equipos')
                    .select('*')
                    .eq('categoria_id', catEncontrada.id);

                if (error) throw error;

                if (!equipos || equipos.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:#999;">No hay equipos registrados en esta categoría</td></tr>`;
                    return;
                }

                tbody.innerHTML = equipos.map(eq => {
                    const escudo = eq.telefono || `https://ui-avatars.com/api/?name=${encodeURIComponent(eq.nombre)}&background=ddd&color=333`;

                    return `
                        <tr>
                            <td><img src="${escudo}" style="width:40px; height:40px; border-radius:50%; object-fit:cover; border: 1px solid #eee;"></td>
                            <td><strong>${eq.nombre}</strong></td>
                            <td>${eq.delegado || 'Sin Asignar'}</td>
                            <td style="text-transform: uppercase; font-size: 0.8rem; font-weight: bold; color: #666;">${catEncontrada.nombre}</td>
                            <td><button onclick="eliminarEquipo('${eq.id}', '${eq.nombre}')" style="border:none; color:red; background:none; cursor:pointer; font-weight:bold;">Eliminar</button></td>
                        </tr>
                    `;
                }).join('');

            } catch (err) {
                console.error('❌ Error al obtener equipos:', err.message);
            }
        }

        async function guardarE() {
            const nombre = document.getElementById('n-eq').value.trim();
            const delegado = document.getElementById('d-eq').value.trim();
            const categoriaSelect = document.getElementById('reg-cat').value;

            if (!nombre || !delegado) {
                alert("Por favor rellena el nombre y el delegado.");
                return;
            }

            const catEncontrada = listaCategoriasBD.find(c =>
                c.nombre.toLowerCase().includes(categoriaSelect.toLowerCase())
            );

            if (!catEncontrada) {
                alert("Error al validar la categoría.");
                return;
            }

            try {
                let urlImagenFinal = `https://ui-avatars.com/api/?name=${encodeURIComponent(nombre)}&background=ddd&color=333`;

                if (archivoImagenReal) {
                    const nombreArchivo = `${Date.now()}_${archivoImagenReal.name.replace(/\s+/g, '_')}`;

                    const { data: uploadData, error: uploadError } = await window.supabase
                        .storage
                        .from('escudos')
                        .upload(nombreArchivo, archivoImagenReal);

                    if (uploadError) throw uploadError;

                    const { data: urlData } = window.supabase
                        .storage
                        .from('escudos')
                        .getPublicUrl(nombreArchivo);

                    urlImagenFinal = urlData.publicUrl;
                }

                const { error } = await window.supabase
                    .from('equipos')
                    .insert([
                        {
                            nombre: nombre,
                            delegado: delegado,
                            categoria_id: catEncontrada.id,
                            telefono: urlImagenFinal
                        }
                    ]);

                if (error) throw error;

                document.getElementById('filtro-categoria').value = categoriaSelect;
                filtrarTabla();
                cerrarM();

            } catch (err) {
                alert("Error al guardar el equipo con su imagen: " + err.message);
                console.error(err);
            }
        }

        async function eliminarEquipo(idEquipo, nombreEquipo) {
            if (confirm(`¿Seguro que deseas eliminar a ${nombreEquipo}?`)) {
                try {
                    const { error } = await window.supabase.from('equipos').delete().eq('id', idEquipo);
                    if (error) throw error;
                    filtrarTabla();
                } catch (err) {
                    alert("No se pudo eliminar: " + err.message);
                }
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            inicializarPantalla();
        });
    </script>
</body>

</html>
